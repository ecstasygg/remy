<svg xmlns="http://www.w3.org/2000/svg" width="720" height="208" viewBox="0 0 720 208" role="img" aria-labelledby="title description">
  <title id="title">Compiler execution correspondence</title>
  <desc id="description">Source evaluation agrees with instruction execution of emitted bytes, with RAX containing the result and the caller frame preserved</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs>
  <rect width="720" height="208" fill="white"/>
  <g fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrow)">
    <path d="M 176 45 H 547"/><path d="M 140 64 V 143"/><path d="M 582 143 V 64"/><path d="M 176 164 H 547"/>
  </g>
  <g fill="white" stroke="#555">
    <rect x="62" y="25" width="114" height="40" rx="3"/><rect x="547" y="25" width="113" height="40" rx="3"/>
    <rect x="38" y="144" width="138" height="40" rx="3"/><rect x="547" y="144" width="138" height="40" rx="3"/>
  </g>
  <g font-family="STIX Two Text, Libertinus Serif, Georgia, serif" font-size="15" fill="#222" text-anchor="middle">
    <text x="119" y="50">expression</text><text x="603" y="50">64-bit value</text>
    <text x="107" y="169">emitted bytes</text><text x="616" y="169">RAX + frame</text>
    <text x="360" y="35">source evaluation</text><text x="360" y="153">x86 instruction execution</text>
    <text x="360" y="106">folding · allocation · branches · encoding</text>
  </g>
</svg>
